<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1612" />
      <stop offset="50%" stop-color="#14241e" />
      <stop offset="100%" stop-color="#192c24" />
    </linearGradient>
    <radialGradient id="glow" cx="130" cy="110" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f2c985" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#d7a25f" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#14241e" stop-opacity="0" />
    </radialGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" rx="16" fill="url(#bg)" stroke="#2d4237" stroke-width="1.5" />
  <circle cx="130" cy="110" r="150" fill="url(#glow)" />

  <!-- Constellation / thread lines -->
  <g stroke="#f2c985" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="3,3">
    <line x1="220" y1="50" x2="310" y2="35" />
    <line x1="310" y1="35" x2="420" y2="48" />
    <line x1="680" y1="40" x2="740" y2="65" />
    <line x1="740" y1="65" x2="710" y2="120" />
    <line x1="620" y1="180" x2="710" y2="160" />
  </g>
  <g fill="#f2c985" fill-opacity="0.35">
    <circle cx="220" cy="50" r="2.5" />
    <circle cx="310" cy="35" r="2" />
    <circle cx="420" cy="48" r="2" />
    <circle cx="680" cy="40" r="2" />
    <circle cx="740" cy="65" r="2.5" />
    <circle cx="710" cy="120" r="2" />
    <circle cx="620" cy="180" r="2" />
    <circle cx="710" cy="160" r="2" />
  </g>

  <!-- Left: Glowing Lantern Mark -->
  <g transform="translate(74, 54)">
    <!-- Base emblem frame -->
    <rect width="112" height="112" rx="28" fill="#17251F" stroke="#32493d" stroke-width="1.5" filter="url(#soft-glow)" />
    <!-- Flame / Lantern motif scaled up 2.33x from 48x48 icon -->
    <g transform="scale(2.333)">
      <path d="M24 7c4 5 5.8 9 5.8 13.1 0 3.2-1.7 5.4-3.8 6.5 5.6-.9 9.5-5.7 8.4-10.9 4.7 5 7 9.6 7 14.4 0 8.5-6.8 14.7-16.7 14.7S8 38.7 8 30.1c0-5 2.7-10.4 7.2-14.5-.5 5.6 1.4 9.1 5.6 10.8C19.4 20.5 21.3 14.1 24 7Z" fill="#D7A25F" />
      <path d="M24.2 29.8c3.3 3.1 4 5.3 4 7.2 0 2.8-1.9 4.7-4.5 4.7s-4.5-1.9-4.5-4.7c0-2.1 1.5-4.8 5-7.2Z" fill="#F2C985" />
    </g>
  </g>

  <!-- Right: Title, Subtitle, and Feature tags -->
  <g transform="translate(225, 0)">
    <!-- Category Eyebrow -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#f2c985" fill-opacity="0.9">
      LOCAL-FIRST MEMORY ATLAS · OPEN AI
    </text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="normal" letter-spacing="1" fill="#fcf8f0">
      afterlight<tspan fill="#f2c985">.</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#c3d2c8">
      A small light for the stories we keep · Made to remember, not recreate
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 162)">
      <!-- Pill 1: Gemma 3 -->
      <rect x="0" y="0" width="108" height="26" rx="13" fill="#1e332a" stroke="#365445" stroke-width="1" />
      <text x="54" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f2c985">Gemma 3 1B</text>

      <!-- Pill 2: Ollama Local -->
      <rect x="118" y="0" width="116" height="26" rx="13" fill="#1e332a" stroke="#365445" stroke-width="1" />
      <text x="176" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0ede4">Ollama Local</text>

      <!-- Pill 3: Zero Packages -->
      <rect x="244" y="0" width="128" height="26" rx="13" fill="#1e332a" stroke="#365445" stroke-width="1" />
      <text x="308" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0ede4">Zero PyPI Deps</text>

      <!-- Pill 4: Sovereign SQLite -->
      <rect x="382" y="0" width="124" height="26" rx="13" fill="#1e332a" stroke="#365445" stroke-width="1" />
      <text x="444" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0ede4">Private SQLite</text>
    </g>
  </g>
</svg>
